services:
  - type: web
    name: javiel-md-platform
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: javiel-md-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: PAIRING_TTL_MINUTES
        value: "10"
      - key: MAX_ACTIVE_DEPLOYMENTS_PER_USER
        value: "3"
      - key: BOT_ROOT
        value: ../bot
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: javiel-md-db
    plan: basic-256mb
    databaseName: javiel
    user: javiel
